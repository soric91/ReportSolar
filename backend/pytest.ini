[pytest]
# Pytest configuration for Solar Maintenance API

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Paths
testpaths = tests

# Markers
markers =
    auth: Authentication tests
    usuarios: Usuario endpoint tests
    proyectos: Proyecto endpoint tests
    reportes: Reporte endpoint tests
    slow: Slow tests
    integration: Integration tests

# Coverage options
addopts =
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -v
    --strict-markers

# Logging
log_cli = true
log_cli_level = INFO
